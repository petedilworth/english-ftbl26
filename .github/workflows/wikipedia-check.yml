name: Wikipedia check

# Measures how closely each club story follows the club's Wikipedia
# article, and commits data/wikipedia-overlap.tsv. Wikipedia is refused at
# the sandbox's proxy but not from Actions. See
# scripts/check_wikipedia_overlap.py for what is measured.
#
# Stories change rarely, so this runs when the script or this file
# changes, or by hand.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wikipedia-check.yml'
      - 'scripts/check_wikipedia_overlap.py'
  workflow_dispatch:

permissions:
  contents: write

# Same queue as everything else that commits to the repo.
concurrency:
  group: england-db
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compare the stories with Wikipedia
        run: python scripts/check_wikipedia_overlap.py

      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wikipedia-overlap.tsv
          git commit -m "Wikipedia overlap of the club stories (checked by workflow)" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
