name: Deploy Site

on:
  schedule:
    - cron: '45 11 * * 1'   # Mondays ~11:45 UTC — fallback in case the workflow_run trigger below is ever missed
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'static/**'
      - 'src/**'
      - 'club_master.csv'
      - 'data/db/england.db'
  workflow_run:
    # Commits made by the Weekly Digest workflow use the default GITHUB_TOKEN,
    # and pushes made with that token do NOT trigger the `push` event above
    # (GitHub's built-in loop-prevention). workflow_run isn't subject to that
    # restriction, so this is what actually catches the digest's DB update.
    workflows: ['Weekly Digest']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python src/site_build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
