name: Club accounts

# Fetches the two latest accounts filings for every club matched to a
# company (data/companies_house.json), reads the tagged figures out of the
# iXBRL ones with scripts/parse_club_accounts.py, and appends them to
# club_finances.csv - filling only club-seasons nobody has read by hand,
# each row flagged ixbrl_auto. The daily Refresh loads the CSV into the
# database; the site picks it up from there.
#
# Also commits, under data/companies/:
#   facts/<club_id>.tsv   every tagged fact in every filing, so a field can
#                         be added or corrected without fetching again
#   accounts-concepts.tsv every concept seen, and which field reads it
#   accounts-report.txt   what was read, and what was not
#   pdf/                  the PDF-only filings: what each is, and its text
#                         (text layer, or OCR for a scan) - see
#                         scripts/read_pdf_accounts.py

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/club-accounts.yml'
      - 'scripts/fetch_club_accounts.py'
      - 'scripts/parse_club_accounts.py'
      - 'scripts/read_pdf_accounts.py'
  schedule:
    - cron: '41 4 3 * *'    # monthly, the 3rd, the day after the register snapshot
  workflow_dispatch:
    inputs:
      clubs:
        description: 'Only these club ids, comma-separated (blank for every club)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: england-db
  cancel-in-progress: false

jobs:
  accounts:
    runs-on: ubuntu-latest
    # The fetch is ~10 minutes; OCR of the scanned PDFs has its own
    # 70-minute budget inside the script and picks up next run where it
    # stopped. The first full read is ~3,000 pages, so two runs.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the PDF tools
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr

      - name: Fetch the filings
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          CLUBS: ${{ inputs.clubs }}
        run: |
          if [ -n "$CLUBS" ]; then
            python scripts/fetch_club_accounts.py --out ch-accounts --clubs "$CLUBS"
          else
            python scripts/fetch_club_accounts.py --out ch-accounts
          fi

      - name: Read the figures
        # bash, not the default sh: pipefail, so a parser that crashes fails
        # the job instead of tee reporting success and committing nothing.
        shell: bash
        run: |
          mkdir -p data/companies
          {
            echo "Club accounts read $(date -u +%Y-%m-%d)"
            echo "Documents: $(ls ch-accounts/*.xhtml 2>/dev/null | wc -l) iXBRL, $(ls ch-accounts/*.pdf 2>/dev/null | wc -l) PDF only"
            python scripts/parse_club_accounts.py ch-accounts --apply 2>&1
          } | tee data/companies/accounts-report.txt

      - name: Read the PDF-only filings
        shell: bash
        # Never blocks the figures above: a failure here is reported in
        # report.txt and the commit goes ahead without it.
        run: |
          mkdir -p data/companies/pdf
          python scripts/read_pdf_accounts.py ch-accounts --out data/companies/pdf \
            --budget-minutes 70 2>&1 | tee data/companies/pdf/report.txt || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add club_finances.csv data/companies/accounts-report.txt \
                  data/companies/accounts-concepts.tsv data/companies/facts data/companies/pdf
          git commit -m "Club accounts read from Companies House (fetched by workflow)" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
