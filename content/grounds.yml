    ground: Craven Cottage
    owner_type: club
    owner_name: Fulham Stadium Ltd (Fulham FC group company)
    since: 1997
    note: Freehold was held by the Church Commissioners for most of the ground's history and then went
      through private hands; Mohamed Al Fayed's 1997 purchase of the club took in the Craven Cottage freehold,
