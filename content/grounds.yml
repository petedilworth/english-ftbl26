  chelsea-fc:
    ground: Stamford Bridge
    owner_type: landlord
    owner_name: Chelsea Pitch Owners plc (fan-shareholder non-profit)
    lease_note: 199-year lease to the club at nominal rent, granted when CPO bought the freehold in 1997;
      a 2017 CPO AGM resolution authorised directors to propose extending it (no evidence found that an
      extension was completed)
    since: 1997
    note: CPO, set up in 1993 to stop the ground being lost to developers, bought the freehold, pitch,
      turnstiles and the Chelsea FC name in 1997 with a £10m loan from Chelsea Village and leases the
      ground back to the club. A 2011 club bid to buy the freehold back won 61.6% of votes but missed
      the 75% threshold; under BlueCo the club has said it intends to redevelop Stamford Bridge rather
      than move and has bought adjacent land.
    as_of: 2024
    confidence: high
    sources:
