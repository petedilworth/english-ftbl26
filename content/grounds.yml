    ground: MKM Stadium
    owner_type: council
    owner_name: Hull City Council
    lease_note: Council leases the stadium to the SuperStadium Management Company (SMC), which sublets
      to Hull City and Hull FC; council said about 25 years remained on the SMC lease (date of statement
      unclear)
    note: Hull City Council owns the stadium; it is run by the SMC, which older reports describe as Allam-owned
      and 2026 reports describe as operated by Hull City under Acun Ilicali. Hull FC's lease runs to the
      end of the 2027 season and is being renegotiated amid public friction with Ilicali.
