# Who owns each club's ground. One entry per club in tiers 1-7 for the
# 2026/27 season, researched in October 2026 from club statements,
# council papers and local reporting (not Wikipedia). See src/grounds.py
# for the owner_type categories. A correction: change the entry, add the
# source, bump as_of. Evidence older than 2018 is never rated high.
# Merged into each club's facts by content.load_club.
researched: October 2026
grounds:
  arsenal-fc:
    ground: Emirates Stadium
    owner_type: club
    owner_name: Arsenal (Emirates Stadium) Ltd, a subsidiary of Arsenal Holdings (ultimately KSE UK Inc
      / Stan Kroenke)
    since: 2006
    note: The freehold is registered to Arsenal (Emirates Stadium) Limited, a wholly owned subsidiary
      of the club's parent Arsenal Holdings, so it would pass with the club in a sale.
    confidence: medium
    sources:
    - https://www.propertyweek.com/news-analysis/who-owns-premier-league-stadiums/5090883.article
    - https://www.aquis.eu/companies/XX.AFC
  aston-villa-fc:
    ground: Villa Park
    owner_type: club
    owner_name: NSWE Stadium Ltd (within NSWE UK Ltd, Aston Villa's group; owners Nassef Sawiris and Wes
      Edens)
    since: 2025
    note: In May 2019 Villa Park was sold for £56.7m to NSWE Stadium Ltd, a company controlled by owners
      Sawiris and Edens, to help the club meet EFL profitability rules. The 2024-25 group accounts report
      a restructure on 19 May 2025 that brought NSWE Stadium Ltd inside NSWE UK, the club's group, so
      the ground is again consolidated with the club.
    as_of: 2026
    confidence: medium
    sources:
    - https://expressandstar.com/sport/football/aston-villa/2019/06/28/villa-park-sold-to-club-owners-in-567million-deal
    - https://theesk.org/2026/05/05/the-analysis-series-nswe-uk-limited-aston-villa-accounts-year-ended-30-june-2025/
  bournemouth-fc:
    ground: Vitality Stadium (Dean Court)
    owner_type: owner_company
    owner_name: Black Knight Stadium Limited (entity created by Bill Foley's Black Knight Football Club)
    lease_note: Club previously leased the ground back from Structadene after a 2005 sale-and-leaseback
    since: 2025
    note: Bournemouth sold the ground to London property company Structadene for about £3.5m in December
      2005 and leased it back. In April 2025 a newly created BKFC entity, Black Knight Stadium Limited,
      agreed to buy it back ahead of expansion to about 20-23,000; reports say this entity, not the club
      company, holds the ground, so it looks like a sister company (structure not confirmed from filings).
    as_of: 2025
    confidence: medium
    sources:
    - https://www.thestadiumbusiness.com/2025/04/28/afc-bournemouth-reacquires-vitality-stadium-amid-development-plans/
    - https://insidersport.com/2025/04/28/afc-bournemouth-set-for-stadium-renovations-after-acquisition/
    - https://stadiumdb.com/news/2025/04/england_bournemouth_set_to_modernize_and_expand_vitality_stadium
  brentford-fc:
    ground: Gtech Community Stadium
    owner_type: club
    owner_name: Brentford FC
    note: Hounslow Council took the freehold of the Lionel Road site by compulsory purchase and leased
      it to the club during the build, with the freehold to return to the club once the stadium was finished.
      The club's accounts carry the stadium as a club asset (revalued to £106.2m at June 2023).
    as_of: 2023
    confidence: medium
    sources:
    - https://new.chiswickw4.com/page/brentfordtw8/info/lionelroad019.htm
    - https://new.actonw3.com/page/shared/common/brentfordfc048.htm
  brighton-and-hove-albion-fc:
    ground: American Express Stadium (Falmer Stadium)
    owner_type: council
    owner_name: Brighton & Hove City Council (freehold); stadium held on long lease by The Community Stadium
      Ltd, a subsidiary of Brighton and Hove Albion Holdings
    lease_end: 2134
    lease_note: 125-year lease of the stadium land from 29 August 2009, for which a premium of GBP 5.3m
      was paid; ground rent payable to the council
    since: 2009
    note: The council made the Falmer site available for the stadium and granted a 125-year long leasehold
      to The Community Stadium Ltd, the club group's stadium company, which built and owns the stadium
